---
name: Java Build (Makefile)

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Build native binaries (true/false) — disabled by default'
        required: false
        default: 'false'
      release_version:
        description: 'Override release version (e.g., v1.2.3) — auto-detected if empty'
        required: false
        default: ''
      marches:
        description: 'Space-separated list of marches (e.g. "x86-64-v2 x86-64-v3 aarm64")'
        required: false
        default: 'compatibility x86-64-v3 aarm64'

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in backend/java/kiwi*
        id: check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            echo "Push to main or develop detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PARENT=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$PARENT" ]; then
            git diff --name-only "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$PARENT" "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check_paths
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Run the Maven verify phase
        working-directory: backend/java/kiwi-parent
        run: make build

      - name: Set up GraalVM
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Make native build Linux (Java backend)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        working-directory: backend/java/kiwi-parent
        env:
          MARCHES: ${{ github.event.inputs.marches || 'compatibility x86-64-v3 aarm64' }}
        run: |
          echo "Building with marches: $MARCHES"
          make native MARCH="$MARCHES"

          for bin in kiwi-jetty*.bin; do
            if [ -f "$bin" ]; then
              base="${bin%.*}"
              ext="${bin##*.}"
              if [[ "$bin" == *"x86-64-v3"* ]]; then
                mv "$bin" "${base}-x64.${ext}"
              elif [[ "$bin" == *"x86-64-v2"* ]]; then
                mv "$bin" "${base}-x86.${ext}"
              elif [[ "$bin" == *"aarm64"* ]] || [[ "$bin" == *"arm64"* ]]; then
                mv "$bin" "${base}-arm64.${ext}"
              elif [[ "$bin" == *"compatibility"* ]]; then
                mv "$bin" "${base}-linux.${ext}"
              fi
            fi
          done

          echo "Generated binaries:"
          ls -la kiwi-jetty*.bin 2>/dev/null || echo "No binarios encontrados"

      - name: Upload fat jar artifact for container workflow
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifacts
          path: backend/java/kiwi-parent/kiwi-transport-jetty/target/kiwi-transport-jetty-*-jar-with-dependencies.jar

      - name: Upload Linux binaries artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: backend/java/kiwi-parent/kiwi-jetty*.bin

  build-macos:
    name: Build macOS native binary (Apple Silicon)
    needs: check_paths
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true') && github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Make native build macOS (Apple Silicon)
        working-directory: backend/java/kiwi-parent
        run: make native

      - name: Rename darwin binary
        working-directory: backend/java/kiwi-parent
        run: |
          for bin in kiwi-jetty*.bin; do
            [ -f "$bin" ] && mv "$bin" "kiwi-jetty-darwin.bin"
          done
          echo "Generated binary:"
          ls -la kiwi-jetty-darwin.bin

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: backend/java/kiwi-parent/kiwi-jetty-darwin.bin

  release:
    needs: [build, build-macos]
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Determine bump type from conventional commits
        id: bump
        run: |
          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -1)
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST_TAG" ]; then
            echo "No previous semver tag — defaulting to minor bump"
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            COMMITS_BODY=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%B")
            COMMITS_SUBJECT=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
            if echo "$COMMITS_BODY" | grep -qE "^BREAKING[- ]CHANGE:" || echo "$COMMITS_SUBJECT" | grep -qE "^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
            elif echo "$COMMITS_SUBJECT" | grep -qE "^feat(\(.+\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "type=${BUMP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new semantic version
        id: semver
        working-directory: backend/java/kiwi-parent
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            NEW_TAG="${{ github.event.inputs.release_version }}"
            NEW_VERSION="${NEW_TAG#v}"
          else
            CURRENT=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\n' | sed 's/-SNAPSHOT//')
            # Normalizar a 3 partes si es necesario (e.g. "1.0" → "1.0.0")
            PART_COUNT=$(echo "$CURRENT" | tr -cd '.' | wc -c)
            if [ "$PART_COUNT" -lt 2 ]; then
              CURRENT="${CURRENT}.0.0"
            elif [ "$PART_COUNT" -lt 3 ]; then
              CURRENT="${CURRENT}.0"
            fi
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            BUMP="${{ steps.bump.outputs.type }}"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            NEW_TAG="v${NEW_VERSION}"
          fi
          echo "value=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_TAG} (bump: ${{ steps.bump.outputs.type }})"

      - name: Update pom versions
        working-directory: backend/java/kiwi-parent
        run: |
          ./mvnw versions:set \
            -DnewVersion="${{ steps.semver.outputs.value }}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.semver.outputs.tag }} --strip all
        env:
          OUTPUT: /tmp/CHANGELOG_RELEASE.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/java/kiwi-parent/pom.xml backend/java/kiwi-parent/*/pom.xml
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): bump version to ${{ steps.semver.outputs.value }} [skip ci]"
          fi
          git push

      - name: Create and push semver tag
        run: |
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      - name: Download Linux binaries
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets
        continue-on-error: true

      - name: Download macOS binary
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets
        continue-on-error: true

      - name: Download fat jar
        uses: actions/download-artifact@v4
        with:
          name: java-build-artifacts
          path: release-assets

      - name: Save release tag for downstream workflows
        run: echo "${{ steps.semver.outputs.tag }}" > release-tag.txt

      - name: Upload release tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          body_path: /tmp/CHANGELOG_RELEASE.md
          files: release-assets/*
          draft: false
          prerelease: false
