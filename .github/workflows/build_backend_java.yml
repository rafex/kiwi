---
name: Java Build (Makefile)

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Run native build (true/false)'
        required: false
        default: 'true'
      release_version:
        description: 'Release version (e.g., v1.20260327-8)'
        required: false
        default: ''
      marches:
        description: 'Space-separated list of marches to build (e.g. "x86-64-v2 x86-64-v3 aarm64")'
        required: false
        default: 'compatibility x86-64-v3 aarm64'

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in backend/java/kiwi*
        id: check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Para push a main o develop, siempre ejecutar build
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            echo "Push to main or develop detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Para otros eventos, verificar cambios
          PARENT=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$PARENT" ]; then
            git diff --name-only "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$PARENT" "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check_paths
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Run the Maven verify phase
        working-directory: backend/java/kiwi-parent
        run: make build

      - name: Set up GraalVM
        if: ${{ github.event.inputs.build_native != 'false' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Make native build Linux (Java backend)
        if: ${{ github.event.inputs.build_native != 'false' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        working-directory: backend/java/kiwi-parent
        env:
          MARCHES: ${{ github.event.inputs.marches || 'compatibility x86-64-v3 aarm64' }}
        run: |
          echo "Building with marches: $MARCHES"
          make native MARCH="$MARCHES"

          # Renombrar binarios con sufijo de arquitectura
          for bin in kiwi-jetty*.bin; do
            if [ -f "$bin" ]; then
              base="${bin%.*}"
              ext="${bin##*.}"
              if [[ "$bin" == *"x86-64-v3"* ]]; then
                mv "$bin" "${base}-x64.${ext}"
              elif [[ "$bin" == *"x86-64-v2"* ]]; then
                mv "$bin" "${base}-x86.${ext}"
              elif [[ "$bin" == *"aarm64"* ]] || [[ "$bin" == *"arm64"* ]]; then
                mv "$bin" "${base}-arm64.${ext}"
              elif [[ "$bin" == *"compatibility"* ]]; then
                mv "$bin" "${base}-linux.${ext}"
              fi
            fi
          done

          echo "Generated binaries:"
          ls -la kiwi-jetty*.bin 2>/dev/null || echo "No binarios encontrados"

      - name: Upload fat jar artifact for container workflow
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifacts
          path: backend/java/kiwi-parent/kiwi-transport-jetty/target/kiwi-transport-jetty-*-jar-with-dependencies.jar

      - name: Upload Linux binaries artifact
        if: ${{ github.event.inputs.build_native != 'false' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: backend/java/kiwi-parent/kiwi-jetty*.bin

  build-macos:
    name: Build macOS native binary (Apple Silicon)
    needs: check_paths
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event.inputs.build_native != 'false' }}
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Make native build macOS (Apple Silicon)
        working-directory: backend/java/kiwi-parent
        run: make native

      - name: Rename darwin binary
        working-directory: backend/java/kiwi-parent
        run: |
          for bin in kiwi-jetty*.bin; do
            [ -f "$bin" ] && mv "$bin" "kiwi-jetty-darwin.bin"
          done
          echo "Generated binary:"
          ls -la kiwi-jetty-darwin.bin

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: backend/java/kiwi-parent/kiwi-jetty-darwin.bin

  release:
    needs: [build, build-macos]
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release_version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_version }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            DATE=$(date +%Y%m%d)
            LAST_TAG=$(git tag -l "v1.${DATE}-*" | sort -V | tail -1)
            if [ -z "$LAST_TAG" ]; then
              NEXT_NUM=1
            else
              LAST_NUM=$(echo "$LAST_TAG" | sed -n "s/v1.${DATE}-//p")
              NEXT_NUM=$((LAST_NUM + 1))
            fi
            RELEASE_VERSION="v1.${DATE}-${NEXT_NUM}"
          else
            RELEASE_VERSION="v1.$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "Release version: $RELEASE_VERSION"
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux binaries
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Download macOS binary
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: Download fat jar
        uses: actions/download-artifact@v4
        with:
          name: java-build-artifacts
          path: release-assets

      - name: Save release tag for downstream workflows
        run: echo "${{ steps.release_version.outputs.value }}" > release-tag.txt

      - name: Upload release tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt

      - name: Publish release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_version.outputs.value }}
          name: Release ${{ steps.release_version.outputs.value }}
          body: 'Release created by CI from ${{ github.ref }}'
          files: release-assets/*
          draft: false
          prerelease: false
