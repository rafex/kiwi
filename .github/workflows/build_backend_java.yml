---
name: Java Build (Makefile)

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Run native build (true/false)'
        required: false
        default: 'true'
      release_tag:
        description: 'Tag name to create a GitHub Release and upload the binary (optional, format vN.YYYYmmDD[-N])'
        required: false
        default: ''
      marches:
        description: 'Space-separated list of marches to build (e.g. "x86-64-v2 x86-64-v3 aarm64")'
        required: false
        default: 'compatibility x86-64-v3'

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in backend/java/kiwi*
        id: check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Detected manual run or tag push; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PARENT=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$PARENT" ]; then
            git diff --name-only "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$PARENT" "${GITHUB_SHA}" | grep -E '^backend/java/kiwi' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
           fi

  build:
    needs: check_paths
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Run the Maven verify phase
        working-directory: backend/java/kiwi-parent
        run: make build

      - name: Update Context Documentation
        run: |
           chmod +x scripts/update-context.sh
           ./scripts/update-context.sh
           git config --global user.name "github-actions"
           git config --global user.email "github-actions@github.com"
           # Create a temporary branch for the update
           git checkout -b temp-docs-update
           # Add and commit changes on the new branch
           git add context/
           git diff --cached --quiet || git commit -m "docs: auto-update context"
           # Fetch main branch and rebase changes
           git fetch origin main
           git rebase origin/main
           # Force push to main (assuming docs update is authoritative)
           git push --force origin temp-docs-update:main

      - name: Set up GraalVM
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_native == 'true' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'  # See 'Options' for more details
          distribution: 'graalvm'  # See 'Supported distributions' for available options

      - name: Make native build (Java backend)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_native == 'true' }}
        working-directory: backend/java/kiwi-parent
        env:
          MARCHES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.marches || '' }}
        run: make native MARCH="$MARCHES"

      - name: Resolve and validate release tag
        id: release_tag
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid release tag format: $RELEASE_TAG"
            echo "Expected format: vN.YYYYmmDD[-N] (examples: v1.20260313, v1.20260313-1, v2.20260313)"
            exit 1
          fi

          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish release and upload assets
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: ${{ steps.release_tag.outputs.value }}
          body: 'Release created by CI'
          files: backend/java/kiwi-parent/kiwi-jetty*.bin
