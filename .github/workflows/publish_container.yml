---
name: Build and Publish Container

on:
  workflow_run:
    workflows: ["Java Build (Makefile)"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión de la release (ej: v1.20260327-8)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in backend/java/kiwi* or backend/java/Dockerfile
        id: check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Para push a main o develop, siempre ejecutar build
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            echo "Push to main or develop detected; allowing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Para otros eventos, verificar cambios
          PARENT=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$PARENT" ]; then
            git diff --name-only "${GITHUB_SHA}" | grep -E '^backend/java/(kiwi|Dockerfile$)' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$PARENT" "${GITHUB_SHA}" | grep -E '^backend/java/(kiwi|Dockerfile$)' > /dev/null && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and push to GHCR
    needs: check_paths
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check_paths.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate image tag
        id: image_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.release_version }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            # Obtener la última release del workflow_run usando jq para formato robusto
            IMAGE_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$IMAGE_TAG" ]; then
              # Si no hay releases, generar una versión basada en la fecha
              IMAGE_TAG="v1.$(date +%Y%m%d)-1"
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Para push a develop, usar versión SNAPSHOT
            IMAGE_TAG="v1.$(date +%Y%m%d)-SNAPSHOT"
          else
            IMAGE_TAG="latest"
          fi
          # Validar formato para tags que no sean "latest"
          if [ "$IMAGE_TAG" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?(-SNAPSHOT)?$'; then
            echo "Invalid tag format: $IMAGE_TAG"
            echo "Expected format: vN.YYYYmmDD[-N] (examples: v1.20260313, v1.20260313-1, v2.20260313)"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Setup Java for build
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: 'x64'

      - name: Download JAR from release or build
        run: |
          echo "Downloading JAR for version: ${{ steps.image_tag.outputs.value }}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Para push a develop, construir el JAR directamente
            echo "Building JAR for develop branch"
            mkdir -p artifacts
            cd backend/java/kiwi-parent
            make build-without-tests
            # Buscar el JAR principal ANTES de cambiar de directorio
            JAR_FILE=$(find target -name "kiwi-transport-jetty*-jar-with-dependencies.jar" | head -1)
            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find target -name "kiwi-transport-jetty*.jar" | head -1)
            fi
            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find target -name "*.jar" | head -1)
            fi
            echo "Found JAR: $JAR_FILE"
            # Copiar el JAR a la carpeta artifacts del root
            cp "$JAR_FILE" ../../../artifacts/
            cd ../../..
          else
            # Descargar el JAR desde la release
            gh release download "${{ steps.image_tag.outputs.value }}" --pattern "*.jar" --dir ./artifacts
            ls -la ./artifacts/
            # Encontrar el JAR principal
            JAR_FILE=$(find ./artifacts -name "kiwi-transport-jetty*-jar-with-dependencies.jar" | head -1)
            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find ./artifacts -name "kiwi-transport-jetty*.jar" | head -1)
            fi
            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find ./artifacts -name "*.jar" | head -1)
            fi
          fi
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (release/latest + sha tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/java/Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAR_FILE=${{ env.JAR_FILE }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kiwi-jetty-backend:${{ steps.image_tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/kiwi-jetty-backend:${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/kiwi-jetty-backend:${{ github.sha }}

      - name: Publish visibility note
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/kiwi-jetty-backend"
          echo "Image pushed to: $IMAGE_BASE"
          echo "Final image URL (primary): $IMAGE_BASE:${{ steps.image_tag.outputs.value }}"
          echo "Final image URL (sha): $IMAGE_BASE:${{ github.sha }}"
          echo "Make the package public in GitHub Packages UI if you want anonymous pulls."
